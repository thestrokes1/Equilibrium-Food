    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://www.equilibriumfood.ar/images/smash-burger.jpg" />

    <!-- Canonical -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

          {
            "@type": "WebSite",
            "@id": "https://www.equilibriumfood.ar/#website",
            "url": "https://www.equilibriumfood.ar/",
            "name": "Equilibrium Food",
            "inLanguage": "en",
            "publisher": { "@id": "https://www.equilibriumfood.ar/#organization" }
